.tb .sheet{text-align:right;min-width:104px}
.tb .sheet small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em}
.tb .sheet b{font-size:20px;font-weight:700}
.tb .doc{grid-column:1/-1;border-top:1px solid var(--line-strong);font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px}
.tb .doc span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .meta{grid-column:1/-1;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.3fr;padding:0}
.tb .meta>div{padding:6px 10px;min-width:0}
.tb .meta>div+div{border-left:1px solid var(--line)}
.tb .meta small{display:block;color:var(--muted);font-size:11px}
.tb .meta span{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

h2{font-weight:700;font-size:24px;line-height:1.15;margin:4px 0 6px}
.lede{color:var(--muted);margin:0 0 16px;max-width:60ch}
.sec{margin:26px 0 0}
.sec>h3{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line-strong)}
.sec>h3 i{font-style:normal;color:var(--muted);font-weight:600}

.search{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:2px;font-size:16px}
.group{margin-top:18px}
.group h4{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 4px;min-height:52px}
.row:active{background:var(--soft)}
.row .nm{flex:1;min-width:0}
.row .nm small{display:block;color:var(--muted);font-size:13px}
.chev{color:var(--muted);flex:none}

.field{display:grid;gap:4px;margin-bottom:14px}
.field label,.field .lb{font-size:13px;font-weight:600}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--surface);border-radius:2px;font-size:16px}
.field textarea{min-height:96px;resize:vertical}
.field.bad input,.field.bad textarea,.field.bad select,.field.bad .seg,.field.bad .padbox{border-color:var(--issue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line-strong);border-radius:2px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:11px 4px;font-size:14px;font-weight:600}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.money{display:flex;align-items:stretch;border:1px solid var(--line);background:var(--surface);border-radius:2px}
.money b{display:grid;place-items:center;padding:0 12px;font-size:22px;border-right:1px solid var(--line);color:var(--muted)}
.money input{border:0!important;background:transparent!important;font-size:26px!important;font-weight:700;padding:10px 12px!important;font-variant-numeric:tabular-nums}
.money em{display:grid;place-items:center;padding:0 12px;font-style:normal;font-size:13px;color:var(--muted)}
.words{font-size:12px;color:var(--muted);letter-spacing:.02em;min-height:1.2em;text-transform:uppercase}

.path{font-size:14px;background:var(--surface);border:1px solid var(--line);padding:10px 12px;border-radius:2px;overflow-wrap:anywhere}
.path span{color:var(--muted)}
.path b{font-weight:700}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

.padbox{border:1px solid var(--line-strong);border-radius:2px;background:#fff;position:relative;touch-action:none}
.padbox canvas{display:block;width:100%;height:210px;touch-action:none;cursor:crosshair}
.padbox .base{position:absolute;left:18px;right:18px;bottom:46px;border-bottom:1.5px solid #8b8f88;pointer-events:none}
.padbox .x{position:absolute;left:18px;bottom:50px;font-size:20px;color:#8b8f88;pointer-events:none}
.padbox .ph{position:absolute;inset:0 0 60px;display:grid;place-items:center;color:#9a9e97;font-size:14px;pointer-events:none}
.padbox .cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#5f655f;font-size:12px;pointer-events:none}
.padbox .ph[hidden]{display:none}
.path a{color:var(--accent);font-weight:700}
.padbox .lockmsg[hidden],.cam .vbox .off[hidden]{display:none}
.padtools{display:flex;justify-content:space-between;align-items:center;margin-top:6px}

.msg{border-left:3px solid var(--issue);background:var(--surface);padding:12px 14px;margin:12px 0}
.msg p{margin:0 0 6px}
.msg p:last-child{margin:0}
.msg.info{border-left-color:var(--accent)}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.skel{height:52px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,transparent,var(--soft),transparent);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

.prog{list-style:none;padding:0;margin:16px 0;border-top:1px solid var(--line)}
.prog li{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px}
.prog li i{font-style:normal;width:18px;flex:none;text-align:center}
.prog li.done i{color:var(--done)}
.prog li.err{color:var(--issue)}
.prog li.run i::before{content:"";display:inline-block;width:10px;height:10px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.result{border:2px solid var(--line-strong);background:var(--surface);padding:16px;margin-top:16px}
.result h3{margin:0 0 6px;font-size:18px}
.result dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0;font-size:14px}
.result dt{color:var(--muted)}
.result dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--ink);background:var(--ink);color:var(--bg);padding:12px 18px;font-weight:700;border-radius:2px;text-decoration:none;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.sum{border:2px solid var(--line-strong);background:var(--surface)}
.sum .amt{padding:16px 16px 14px;border-bottom:1px solid var(--line-strong)}
.sum .amt small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sum .amt b{display:block;font-size:40px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0 6px;overflow-wrap:anywhere}
.sum .amt b em{font-style:normal;font-size:16px;font-weight:600;color:var(--muted);margin-left:6px}
.sum .amt span{display:block;font-size:13px;color:var(--muted);letter-spacing:.02em}
.sum dl{margin:0}
.sum .kv{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
.sum .kv:last-child{border-bottom:0}
.sum dt{font-size:13px;color:var(--muted)}
.sum dd{margin:0;font-size:16px;font-weight:600;overflow-wrap:anywhere;white-space:pre-line}
.stmt{font-size:14px;color:var(--muted);margin:14px 0 0;line-height:1.5}
.cam{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;border:1px solid var(--line-strong);background:var(--surface);padding:10px;margin-bottom:14px}
.cam .vbox{position:relative;width:96px;aspect-ratio:3/4;background:var(--soft);overflow:hidden;border-radius:2px}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.cam .vbox .off{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;color:var(--muted)}
.cam .vbox.rec{outline:3px solid #D23B2A;outline-offset:-3px}
.cam b{display:block;font-size:16px}
.cam p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#D23B2A;margin-right:6px;vertical-align:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.recdot{animation:none}}
.cnt{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.steps{display:flex;gap:6px;margin:6px 0 0}
.steps i{flex:1;height:4px;background:var(--line);border-radius:2px}
.steps i.on{background:var(--ink)}
.padbox.locked canvas{pointer-events:none}
.cam.live{grid-template-columns:1fr}
.cam.live .vbox{position:absolute;width:2px;height:2px;opacity:0;overflow:hidden;pointer-events:none}
.padbox.recording{outline:3px solid #D23B2A;outline-offset:2px}
.sigprev{margin:0 0 16px;background:#fff;border:1px solid var(--line-strong);padding:14px 16px 10px;text-align:center}
.sigprev img{max-width:100%;max-height:110px;display:block;margin:0 auto 6px}
.sigprev figcaption{font-size:12px;color:#5f655f;border-top:1.5px solid #8b8f88;padding-top:6px}
.onevid{margin:0 0 16px}
.onevid video{width:100%;max-height:60vh;aspect-ratio:3/4;object-fit:contain;background:#000;display:block;border:1px solid var(--line-strong)}
.onevid figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.cam .vbox canvas.wmprev{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.padbox.locked{opacity:.45}
.padbox .lockmsg{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600;color:#1a1d1b;pointer-events:none;text-align:center;padding:0 24px}
.clips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.clips figure{margin:0}
.clips video{width:100%;aspect-ratio:3/4;object-fit:cover;background:#000;display:block;border:1px solid var(--line-strong)}
.clips figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.chkbig{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;border:2px solid var(--line-strong);background:var(--surface);padding:16px;font-size:16px;line-height:1.45;cursor:pointer}
.chkbig input{width:26px;height:26px;margin:0;accent-color:var(--accent)}
.chkbig.on{border-color:var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line-strong);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .btn{flex:1}
.bar:empty,.bar .in:empty{display:none}
</style>
<style>
.acct{display:flex;align-items:center;gap:10px;border:1px solid var(--line-strong);background:var(--surface);padding:10px 12px;margin-bottom:18px;font-size:14px}
.acct b{flex:1;min-width:0}
.acct .dot{width:10px;height:10px;border-radius:50%;background:var(--issue);flex:none}
.acct.on .dot{background:var(--done)}
.acct .btn{min-height:40px;padding:8px 12px}
</style>
</head>

<div class="wrap">
  <header class="tb" id="tb"></header>
  <div id="acct"></div>
  <main id="main"></main>
</div>
<nav class="bar" id="barwrap"><div class="in" id="bar"></div></nav>

/* ---------- receipt data from the link ---------- */
function readPayload() {
  const m = location.hash.match(/[#&]r=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try {
    let b = m[1].replace(/-/g, "+").replace(/_/g, "/"); b += "=".repeat((4 - b.length % 4) % 4);
    const bin = atob(b), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const d = JSON.parse(new TextDecoder().decode(bytes));
    if (!d || !d.id || !d.folderId || !d.vendor || !(d.amount > 0) || !d.date) return null;
    return d;
  } catch { return null; }
}

function numWords(n) {
  const U = ["","UN","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE","DIEZ","ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISÉIS","DIECISIETE","DIECIOCHO","DIECINUEVE","VEINTE","VEINTIÚN","VEINTIDÓS","VEINTITRÉS","VEINTICUATRO","VEINTICINCO","VEINTISÉIS","VEINTISIETE","VEINTIOCHO","VEINTINUEVE"];
  const D = ["","","","TREINTA","CUARENTA","CINCUENTA","SESENTA","SETENTA","OCHENTA","NOVENTA"];
  const C = ["","CIENTO","DOSCIENTOS","TRESCIENTOS","CUATROCIENTOS","QUINIENTOS","SEISCIENTOS","SETECIENTOS","OCHOCIENTOS","NOVECIENTOS"];
  const h = x => {
    if (!x) return ""; if (x === 100) return "CIEN";
    const c = Math.floor(x / 100), r = x % 100; let s = C[c];
    if (r) s += (s ? " " : "") + (r < 30 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? " Y " + U[r % 10] : ""));
    return s;
  };
  if (n === 0) return "CERO";
  const out = [];
  const mill = Math.floor(n / 1e6), th = Math.floor((n % 1e6) / 1000), r = n % 1000;
  if (mill) out.push(mill === 1 ? "UN MILLÓN" : numWords(mill) + " MILLONES");
  if (th) out.push(th === 1 ? "MIL" : h(th) + " MIL");
  if (r) out.push(h(r));
  return out.join(" ");

function amountWords(n) {
  if (!n) return "";

  const w = numWords(ent);

/* ---------- Google Drive (REST) ---------- */
const escQ = s => String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
async function gapi(url, opts = {}) {
  const t = savedToken();
  if (!t) throw { code: "auth" };
  let r;
  try { r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + t } }); }
  catch { throw { message: "Sin conexión con Google Drive. Revisa tu internet y reintenta." }; }
  if (r.status === 401) { LSset("tok", null); throw { code: "auth" }; }
  if (!r.ok) {
    let msg = ""; try { msg = (await r.json()).error?.message || ""; } catch {}
    if (r.status === 404) throw { message: "No se encontró la carpeta del recibo, o esta cuenta de Google no tiene acceso a ella." };
    throw { message: `Google Drive respondió con un error (${r.status})${msg ? ": " + msg : "."}` };
  }
  return r.json();
}
const DQ = "supportsAllDrives=true&includeItemsFromAllDrives=true";
async function listIn(folderId, extra) {
  const q = `'${escQ(folderId)}' in parents and trashed = false${extra ? " and " + extra : ""}`;
  const d = await gapi(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name,webViewLink)&pageSize=1000&${DQ}`);
  return d.files || [];
}
async function uploadFile(blob, name, folderId, mime) {
  const b = "rcb" + Math.random().toString(36).slice(2);
  const meta = { name, parents: [folderId], mimeType: mime };
  const body = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${mime}\r\n\r\n`, blob, `\r\n--${b}--`]);
  return gapi(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id,name,webViewLink`, { method: "POST", headers: { "Content-Type": `multipart/related; boundary=${b}` }, body });
}
async function checkFolder() {
  try { await gapi(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(S.dest.folderId)}?fields=id&supportsAllDrives=true`); S.folderOk = true; }

/* ---------- continuous recording while signing (live camera) ----------
   lead (5 s, box locked) → sign (box enabled, keeps recording) → Enviar → tail (5 s) → stop */
const LEAD_SECS = 5, TAIL_SECS = 5, MAX_SECS = 60; // keeps the video around 3 MB
const LIVE = { mr: null, chunks: [], t0: 0, tailEnd: 0, timer: null, resolve: null, reject: null };
const mmss = s => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
function liveStart() {
  WM.canvas = null; WM.width = 480; WM.fps = 24;
  wmStart("ANTES DE FIRMAR");
  const rs = recStream(); CAM.watermarked = rs.watermarked;
  return new Promise((res, rej) => {
    LIVE.resolve = res; LIVE.reject = rej; LIVE.chunks = [];
    const opts = { videoBitsPerSecond: 350000, audioBitsPerSecond: 32000 }; if (CAM.mime) opts.mimeType = CAM.mime;
    let mr;
    try { mr = new MediaRecorder(rs.stream, opts); } catch { try { mr = new MediaRecorder(rs.stream); } catch (e) { rej(e); return; } }
    LIVE.mr = mr;
    mr.ondataavailable = e => { if (e.data && e.data.size) LIVE.chunks.push(e.data); };
    mr.onerror = e => { liveCleanup(); rej(e.error || e); };
    mr.onstop = () => {
      liveCleanup();
      const b = new Blob(LIVE.chunks, { type: baseMime(mr.mimeType || CAM.mime) });
      b.size ? res(b) : rej({ message: "La grabación salió vacía. Intenta de nuevo." });
    };
    mr.start(1000);
    LIVE.t0 = Date.now();
    LIVE.timer = setInterval(liveTick, 250);
    liveTick();
  });
}
function liveCleanup() { clearInterval(LIVE.timer); LIVE.timer = null; wmStop(); }
function liveTick() {
  const el = (Date.now() - LIVE.t0) / 1000;
  if (S.ph === "lead") {
    CAM.left = Math.max(0, Math.ceil(LEAD_SECS - el));
    if (el >= LEAD_SECS - 1 && !CAM.frames[0]) CAM.frames[0] = grabFrame();
    if (el >= LEAD_SECS) { S.ph = "sign"; WM.label = "FIRMANDO"; flowUi(); }
  } else if (S.ph === "sign") {
    if (el >= MAX_SECS - TAIL_SECS) liveSend(true);
  } else if (S.ph === "tail") {
    const left = (LIVE.tailEnd - Date.now()) / 1000;
    CAM.left = Math.max(0, Math.ceil(left));
    if (left <= 1 && !CAM.frames[1]) CAM.frames[1] = grabFrame();
    if (left <= 0 && LIVE.mr && LIVE.mr.state !== "inactive") { S.ph = "stopping"; flowUi(); try { LIVE.mr.requestData(); } catch {} LIVE.mr.stop(); return; }
  }
  const t = $("#rectime"); if (t) t.textContent = mmss(el);
  const lm = $("#lockmsg"); if (lm && S.ph === "lead") lm.textContent = `La firma se activa en ${CAM.left} s`;
  const cnt = $("#reccnt"); if (cnt) cnt.textContent = S.ph === "sign" && el > MAX_SECS - TAIL_SECS - 10 ? `Quedan ${Math.max(0, Math.ceil(MAX_SECS - TAIL_SECS - el))} s para firmar` : S.ph === "tail" ? `Terminando en ${CAM.left} s` : "";
  if (S.ph === "lead" || S.ph === "tail") renderBar();
}
function liveSend(auto) {
  if (S.ph !== "sign") return;
  if (!hasSig() && !auto) { S.bad = new Set(["sig"]); markBad(); return; }
  S.bad = new Set(); markBad();
  S.ph = "tail"; WM.label = "DESPUÉS DE FIRMAR"; LIVE.tailEnd = Date.now() + TAIL_SECS * 1000; flowUi(); liveTick();
}

/* ---------- signature pad ---------- */
const PAD = { strokes: [], cur: null, c: null, ctx: null, w: 0, h: 0 };
const hasSig = () => PAD.strokes.some(s => s.length > 1) || PAD.strokes.length > 2;

  const c = $("#pad"); if (!c) return;
  PAD.c = c; PAD.ctx = c.getContext("2d");
  padResize();

    if (S.ph !== "sign") return;
    ev.preventDefault(); c.setPointerCapture(ev.pointerId);
    PAD.cur = [padPt(ev)]; PAD.strokes.push(PAD.cur); padRedraw(); padStatus();
  });

    if (!PAD.cur) return; ev.preventDefault();

    for (const e of evs) PAD.cur.push(padPt(e));

// Signature cropped to its ink, as a transparent PNG for the PDF
function signaturePng() {
  if (!PAD.strokes.length) return null;
  const W = PAD.w || 600, H = PAD.h || 210, sc = 3;
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0;

    doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(...muted); doc.text(pdfT(lbl), x + 3, yy + 4.5);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(...ink);
    doc.text(doc.splitTextToSize(pdfT(val || "-"), w - 6)[0], x + 3, yy + 10);
  };
  doc.line(M, y + 30, M + CW, y + 30);
  const c1 = CW * 0.6;
  doc.line(M + c1, y + 16, M + c1, y + 44);
  cell(M, y + 16, c1, "PROYECTO", S.project?.name);
  cell(M + c1, y + 16, CW - c1, "FECHA", dateLong);
  cell(M, y + 30, c1, prov ? "PROVEEDOR / CONTRATISTA" : "CLIENTE", r.vendor);
  cell(M + c1, y + 30, CW - c1, "DISCIPLINA", r.disc || "-");
  y += 52;

  // Amount
  doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...muted);
  doc.text("IMPORTE", M, y);
  doc.setFont("helvetica", "bold"); doc.setFontSize(26); doc.setTextColor(...ink);
  doc.text(pdfT(`$${fmtAmt(amt)}`), M, y + 11);
  const aw = doc.getTextWidth(pdfT(`$${fmtAmt(amt)}`));
  doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(...muted);
  doc.text("MXN", M + aw + 3, y + 11);
  doc.setFontSize(9.5); doc.setTextColor(...ink);
  const words = doc.splitTextToSize(pdfT(`(${amountWords(amt)})`), CW);
  doc.text(words, M, y + 18);
  y += 18 + words.length * 4.6 + 4;
  doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...muted);
  doc.text(pdfT("FORMA DE PAGO"), M, y);
  doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(...ink);
  doc.text(pdfT(r.method || "-"), M + 32, y);
  y += 6;
  doc.setDrawColor(...line); doc.setLineWidth(0.25); doc.line(M, y, M + CW, y);
  y += 8;

  // Description
  doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...muted);
  doc.text("CONCEPTO / SERVICIO PRESTADO", M, y);
  y += 5.5;
  doc.setFontSize(10.5); doc.setTextColor(...ink);
  const desc = doc.splitTextToSize(pdfT(r.desc), CW);
  const maxLines = 22;
  doc.text(desc.slice(0, maxLines), M, y);
  y += Math.min(desc.length, maxLines) * 5 + 6;

  // Statement
  const signer = (r.signer || r.vendor).trim(), stmt = stmtText(r, S.project?.name);
  doc.setFontSize(9.5); doc.setTextColor(...muted);
  const st = doc.splitTextToSize(pdfT(stmt), CW);
  doc.text(st, M, y);
  y += st.length * 4.6;

  // Signature block, anchored near the bottom of the page
  const sy = Math.max(y + 14, S.verify ? 158 : 205);
  const sw = 90, sx = M + (CW - sw) / 2, lineY = sy + 32;
  if (sig) {
    let h = 28, w = h * sig.ratio;
    if (w > sw) { w = sw; h = w / sig.ratio; }
    doc.addImage(sig.url, "PNG", sx + (sw - w) / 2, lineY - h - 1, w, h, "firma", "FAST");
  }
  doc.setDrawColor(...gray); doc.setLineWidth(0.35); doc.line(sx, lineY, sx + sw, lineY);
  doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(...ink);
  doc.text(pdfT(signer), sx + sw / 2, lineY + 5.5, { align: "center" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...muted);
  doc.text(prov ? "FIRMA DE QUIEN RECIBE" : "FIRMA DE QUIEN ENTREGA", sx + sw / 2, lineY + 10, { align: "center" });

  // Identity verification: stills from both recordings + signer's confirmation
  const V = S.verify;
  if (V) {
    let vy = lineY + 18;
    if (vy + 46 > 264) { doc.addPage(); vy = M; }
    doc.setDrawColor(...line); doc.setLineWidth(0.25); doc.line(M, vy - 5, M + CW, vy - 5);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...muted);
    doc.text("VERIFICACIÓN DE IDENTIDAD", M, vy);
    const th = 36; let tx = M;
    V.frames.forEach((f, i) => {
      const tw = f ? th * f.ratio : th * 0.75;
      if (f) doc.addImage(f.url, "JPEG", tx, vy + 3, tw, th, "fr" + i, "FAST");
      else { doc.setDrawColor(...line); doc.rect(tx, vy + 3, tw, th); }
      doc.setFontSize(7); doc.setTextColor(...muted);
      doc.text(i ? "Después de firmar" : "Antes de firmar", tx, vy + th + 6.5);
      tx += tw + 4;
    });
    const textX = tx + 4, tw2 = M + CW - textX;
    doc.setFontSize(8.5); doc.setTextColor(...ink);
    const lines = doc.splitTextToSize(pdfT(V.text), tw2);
    doc.text(lines, textX, vy + 6);
    doc.setFontSize(7.5); doc.setTextColor(...muted);
    doc.text(doc.splitTextToSize(pdfT(V.files), tw2), textX, vy + 6 + lines.length * 3.9 + 3);
  }

  // Footer
  const now = new Date();
  doc.setFontSize(7.5); doc.setTextColor(...muted);
  for (let pg = 1; pg <= doc.getNumberOfPages(); pg++) {
    doc.setPage(pg);
    doc.text(pdfT(`Recibo ${folio} · Firmado en el teléfono el ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} a las ${pad(now.getHours())}:${pad(now.getMinutes())}`), M, 270);
    doc.text("Terrestre", M + CW, 270, { align: "right" });
  }
  return doc.output("blob");
}



/* ---------- signing flow ---------- */
async function startFlow() {
  if (!savedToken()) { CAM.err = "Primero conecta Google Drive (arriba)."; flowUi(); return; }
  const sg = (S.r.signer || "").trim();
  if (!sg) { S.bad = new Set(["signer"]); markBad(); return; }
  CAM.err = null; CAM.frames = [null, null]; PAD.strokes = []; padRedraw(); padStatus();
  S.ph = "cam"; flowUi();
  try {
    S.geo = null;
    const geoP = geoStart();
    await whiteLogo();
    await camStart();
    await Promise.race([geoP, sleep(4000)]);
    const pb = $(".padbox"); if (pb) pb.scrollIntoView({ behavior: "smooth", block: "center" });
    S.ph = "lead"; flowUi();
    const blob = await liveStart();
    camStop();
    if (!hasSig()) { S.ph = "review"; CAM.err = "Se acabó el tiempo sin firma. Vuelve a intentar."; flowUi(); return; }
    if (S.clipUrl) URL.revokeObjectURL(S.clipUrl);
    S.clip = blob; S.clipUrl = URL.createObjectURL(blob);
    S.ph = "ready"; S.view = "confirm"; S.confirmed = false; $("#main").innerHTML = ""; render(); window.scrollTo(0, 0);
  } catch (e) { liveCleanup(); camStop(); S.ph = "review"; CAM.err = camErrText(e); flowUi(); }
}
function resetFlow() {
  liveCleanup(); camStop(); PAD.strokes = []; S.ph = "review"; S.confirmed = false; CAM.err = null; CAM.frames = [null, null];
  if (S.clipUrl) URL.revokeObjectURL(S.clipUrl); S.clip = null; S.clipUrl = null;
}
function flowUi() {
  const ph = S.ph, live = ph === "lead" || ph === "sign" || ph === "tail" || ph === "stopping";
  const box = $("#camstat");
  if (box) {
    const step = { review: 0, cam: 1, lead: 1, sign: 2, tail: 3, stopping: 3, ready: 4 }[ph] || 0;
    let t, d;
    if (ph === "review") { t = "Firma con video"; d = `La cámara frontal graba todo: ${LEAD_SECS} segundos antes de firmar, mientras firmas y ${TAIL_SECS} segundos después de tocar “Enviar”. Quien firma no se ve en pantalla.`; }
    else if (ph === "cam") { t = "Abriendo cámara y ubicación…"; d = "Permite el acceso a la cámara, al micrófono y a la ubicación si el teléfono lo pide."; }
    else { t = `<span class="recdot"></span>Grabando · <span id="rectime">0:00</span>`; d = (ph === "lead" ? "Mira a la cámara. La firma se activa en unos segundos." : ph === "sign" ? "Firma en el recuadro y toca “Enviar”." : ph === "stopping" ? "Guardando grabación…" : "Sigue mirando a la cámara.") + `<br><span id="reccnt"></span>`; }
    box.innerHTML = `<b>${t}</b><p>${d}</p><div class="steps">${[1, 2, 3, 4].map(n => `<i class="${n <= step ? "on" : ""}"></i>`).join("")}</div>`;
  }
  const pb = $(".padbox");
  if (pb) {
    pb.classList.toggle("locked", ph !== "sign" && ph !== "tail" && ph !== "stopping");
    pb.classList.toggle("recording", live);
    pb.style.pointerEvents = ph === "tail" || ph === "stopping" ? "none" : "";
    const lm = $("#lockmsg");
    if (lm) { lm.hidden = ph === "sign" || ph === "tail" || ph === "stopping"; lm.textContent = ph === "lead" ? `La firma se activa en ${CAM.left} s` : "Toca “Iniciar firma” para empezar"; }
  }
  document.querySelectorAll(".padtools .link").forEach(b => b.hidden = ph !== "sign");
  const ce = $("#camerr"); if (ce) ce.innerHTML = CAM.err ? `<div class="msg"><p>${esc(CAM.err)}</p></div>` : "";
  const si = $("#signer"); if (si) si.disabled = ph !== "review";
  renderBar();
}
function markBad() {
  document.querySelectorAll("[data-f]").forEach(el => el.classList.toggle("bad", S.bad.has(el.dataset.f)));
  const m = $("#badmsg");
  if (m) m.innerHTML = S.bad.has("sig") ? `<div class="msg"><p>Falta la firma.</p></div>` : S.bad.has("signer") ? `<div class="msg"><p>Escribe el nombre de quien firma.</p></div>` : "";
}
function confirmText() {
  const r = S.r, signer = (r.signer || r.vendor).trim();
  return `Confirmo que yo, ${signer}, firmé este recibo por $${fmtAmt(parseAmt(r.amount))} MXN, que soy la persona que aparece en el video y que estoy de acuerdo con lo que firmé.`;
}

/* ---------- save: PDF + video to the project's Recibos folder ---------- */
async function submit() {
  if (!S.confirmed || !S.clip) return;
  if (!savedToken()) { try { await signIn(); renderAcct(); } catch (e) { alert(e.message); return; } }
  const sig = signaturePng();
  S.run = { status: "run", steps: [
    { k: "folio", t: "Número de recibo", s: "wait" },
    { k: "pdf", t: "Generar PDF", s: "wait" },
    { k: "keep", t: "Guardar copia en el teléfono", s: "wait" },
    { k: "up", t: "Subir PDF a Drive", s: "wait" },
    { k: "v", t: "Subir video a Drive", s: "wait" }
  ], sig, frames: [...CAM.frames], clip: S.clip, confirmText: confirmText(), confirmedAt: Date.now(), geo: geoText(), watermarked: CAM.watermarked, signer: (S.r.signer || S.r.vendor).trim() };
  S.view = "run"; render(); window.scrollTo(0, 0);
  await runSteps();
}
async function runSteps() {
  const R = S.run; R.status = "run"; R.err = null; render();
  const step = k => R.steps.find(s => s.k === k);
  const go = async (k, fn) => { const s = step(k); if (s.s === "done") return; s.s = "run"; render(); await fn(); s.s = "done"; render(); };
  let cur = null;
  try {
    const d = S.dest;
    cur = "folio"; await go("folio", async () => {
      const files = await listIn(d.folderId, "mimeType = 'application/pdf'");
      let max = 0;
      for (const f of files) { const m = String(f.name || "").match(/Recibo\s+\d{6}-(\d{3,})/); if (m) max = Math.max(max, +m[1]); }
      const n = Math.max(max, files.length) + 1, [yy, mm] = S.r.date.split("-");
      R.folio = `${yy}${mm}-${String(n).padStart(3, "0")}`;
      R.base = `${S.r.date} Recibo ${R.folio} ${fileSafe(S.r.vendor)}${S.r.disc ? " - " + fileSafe(S.r.disc.replace(/^\d+\s*/, "")) : ""}`;
      R.pdfName = `${R.base}.pdf`; R.vidName = `${R.base} - video firma.${extOf(R.clip.type)}`;
      renderHeader();
    });
    cur = "pdf"; await go("pdf", async () => {
      const ca = new Date(R.confirmedAt);
      S.verify = { frames: R.frames,
        text: `${R.confirmText} Confirmado en el teléfono el ${pad(ca.getDate())}/${pad(ca.getMonth() + 1)}/${ca.getFullYear()} a las ${pad(ca.getHours())}:${pad(ca.getMinutes())}:${pad(ca.getSeconds())}.`,
        files: `Ubicación al firmar: ${R.geo}. Grabación continua con la cámara frontal: ${LEAD_SECS} s antes de firmar, durante la firma y ${TAIL_SECS} s después de enviarla${R.watermarked ? ", con marca de agua de fecha, hora, ubicación y datos del recibo" : ""}, guardada junto a este PDF: ${R.vidName}` };
      const keepSigner = S.r.signer; S.r.signer = R.signer;
      try { R.pdf = buildPdf(R.folio, R.sig); } finally { S.verify = null; S.r.signer = keepSigner; }
    });
    cur = "keep"; await go("keep", async () => {
      await IDB.put(S.id, { pdf: R.pdf, clip: R.clip, folio: R.folio, pdfName: R.pdfName, vidName: R.vidName, at: Date.now() }).catch(() => {});
    });
    cur = "up"; await go("up", async () => {
      const dup = (await listIn(d.folderId, `name = '${escQ(R.pdfName)}'`))[0];
      const f = dup || await uploadFile(R.pdf, R.pdfName, d.folderId, "application/pdf");
      R.pdfUrl = f.webViewLink || `https://drive.google.com/file/d/${f.id}/view`;
    });
    cur = "v"; await go("v", async () => {
      const dup = (await listIn(d.folderId, `name = '${escQ(R.vidName)}'`))[0];
      const f = dup || await uploadFile(R.clip, R.vidName, d.folderId, baseMime(R.clip.type));
      R.vidUrl = f.webViewLink || `https://drive.google.com/file/d/${f.id}/view`;
    });
    R.status = "done";
    S.done = { folio: R.folio, pdfUrl: R.pdfUrl, vidUrl: R.vidUrl, at: Date.now() };
    LSset("done:" + S.id, JSON.stringify(S.done));
    S.view = "done";
    await IDB.del(S.id);
    resetFlow();
  } catch (e) {
    const s = cur && step(cur);
    if (e?.code === "auth") { if (s) s.s = "wait"; R.status = "auth"; }
    else { if (s) s.s = "err"; R.status = "err"; R.err = e?.message || String(e); }
  }
  render();
}

  const el = ev.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a;
  if (a === "signIn") { try { await signIn(); checkFolder(); } catch (e) { CAM.err = e.message; flowUi(); } render(); }
  else if (a === "startFlow") startFlow();
  else if (a === "liveSend") liveSend(false);
  else if (a === "cancelFlow") { resetFlow(); padRedraw(); padStatus(); flowUi(); }
  else if (a === "sigClear") { if (S.ph === "sign") { PAD.strokes = []; padRedraw(); padStatus(); } }
  else if (a === "sigUndo") { if (S.ph === "sign") { PAD.strokes.pop(); padRedraw(); padStatus(); } }
  else if (a === "redoAll") { resetFlow(); S.view = "sign"; $("#main").innerHTML = ""; render(); window.scrollTo(0, 0); }
  else if (a === "submit") submit();
  else if (a === "retry") runSteps();
  else if (a === "authRetry") { try { await signIn(); renderAcct(); runSteps(); } catch (e) { S.run.status = "err"; S.run.err = e.message; render(); } }
});
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.k === "signer") { S.r.signer = el.value; const st = $("#stmt"); if (st) st.textContent = stmtText(S.r, S.r.project); if (el.value.trim()) { S.bad.delete("signer"); markBad(); } }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.i === "confirm") { S.confirmed = el.checked; el.closest(".chkbig").classList.toggle("on", el.checked); renderBar(); }
});
window.addEventListener("pagehide", () => { if (S.ph !== "stopping") camStop(); });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(padResize, 120); });

/* ---------- boot ---------- */
(async () => {
  const d = readPayload();
  if (!d) { S.view = "nodata"; render(); return; }
  S.id = d.id;
  S.r = { type: d.type === "cliente" ? "cliente" : "proveedor", vendor: d.vendor, signer: d.signer || d.vendor, disc: d.disc || "", amount: String(d.amount), desc: d.desc || "", date: d.date, method: d.method || "", project: d.project || "" };
  S.project = { name: d.project || "" };
  S.dest = { folderId: d.folderId, folderUrl: d.folderUrl, path: d.path };
  const done = (() => { try { return JSON.parse(LS("done:" + d.id) || "null"); } catch { return null; } })();
  if (done) { S.done = done; S.view = "done"; render(); return; }
  const pend = await IDB.get(d.id);
  if (pend && pend.pdf && pend.clip) {
    // a confirmed receipt that hadn't finished uploading: resume it
    S.run = { status: "err", err: "La subida se interrumpió.", folio: pend.folio, pdfName: pend.pdfName, vidName: pend.vidName, pdf: pend.pdf, clip: pend.clip,
      steps: [{ k: "folio", t: "Número de recibo", s: "done" }, { k: "pdf", t: "Generar PDF", s: "done" }, { k: "keep", t: "Guardar copia en el teléfono", s: "done" }, { k: "up", t: "Subir PDF a Drive", s: "wait" }, { k: "v", t: "Subir video a Drive", s: "wait" }] };
    S.view = "run"; render();
    if (savedToken()) runSteps();
    else { S.run.status = "auth"; render(); }
    return;
  }
  S.view = "sign"; render();
  if (savedToken()) checkFolder();
  // the Google library loads async; refresh the account bar once it's there
  const iv = setInterval(() => { if (window.google?.accounts?.oauth2) { clearInterval(iv); initGis(); } }, 300);
  setTimeout(() => clearInterval(iv), 20000);
})();
})();
</script>
